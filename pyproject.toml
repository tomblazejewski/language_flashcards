[project]
name = "language-flashcards"
version = "0.1.0"
description = "Backend API for the Language Flashcards spaced-repetition app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.135.2",
    "uvicorn[standard]==0.42.0",
    # Database
    "sqlalchemy[asyncio]==2.0.48",
    "alembic==1.18.4",
    "aiosqlite==0.22.1",
    "asyncpg==0.31.0",
    "psycopg2-binary==2.9.11",
    # Auth
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==3.2.2",
    # Settings
    "pydantic[email]==2.12.5",
    "pydantic-settings==2.13.1",
    # SRS
    "fsrs==6.3.1",
    # File uploads
    "python-multipart==0.0.22",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "pytest-cov==7.1.0",
    "ruff==0.14.10",
    "ty==0.0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/migrations/versions/*.py" = ["W291"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
filterwarnings = ["ignore::DeprecationWarning:passlib"]

[tool.coverage.run]
source = ["backend/app"]
omit = ["backend/tests/*"]
