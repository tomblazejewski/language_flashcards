name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.9"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check backend

      - name: Type check
        run: uv run ty check backend/app

      - name: Test
        run: uv run pytest backend/tests -q

      - name: Build Docker image
        run: docker build -t language-flashcards-backend -f backend/Dockerfile .
